services:
  - type: web
    name: the-tech-shop-storefront
    runtime: docker
    plan: free
    region: singapore
    dockerfilePath: ./Dockerfile.render
    healthCheckPath: /
    envVars:
      - key: RENDER_DATABASE_URL
        fromDatabase:
          name: the-tech-shop-postgres
          property: connectionString
      - key: DB_USERNAME
        fromDatabase:
          name: the-tech-shop-postgres
          property: user
      - key: DB_PASSWORD
        fromDatabase:
          name: the-tech-shop-postgres
          property: password
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_EXPIRATION
        value: '3600000'

databases:
  - name: the-tech-shop-postgres
    plan: free
    region: singapore
    postgresMajorVersion: '16'
    ipAllowList: []

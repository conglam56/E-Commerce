spring:
  config:
    import: optional:file:.env[.properties]
  application:
    name: e-commerce
  
  # PostgreSQL Database Configuration
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5434/e-commerce}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver
    
  # JPA/Hibernate Configuration
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        format_sql: true
        default_batch_fetch_size: 100
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    
  # Flyway Configuration
  flyway:
    enabled: true
    baseline-on-migrate: true
payment:
  vnpay:
    tmn-code: ${VNPAY_TMN_CODE:}
    hash-secret: ${VNPAY_HASH_SECRET:}
account:
  public-url: ${ACCOUNT_PUBLIC_URL:${RENDER_EXTERNAL_URL:http://localhost:5173}}
  mail:
    endpoint: ${ACCOUNT_MAIL_ENDPOINT:https://api.resend.com/emails}
    key: ${RESEND_API_KEY:}
    from: ${ACCOUNT_MAIL_FROM:}
jwt:
  secret: ${JWT_SECRET}
  expiration: ${JWT_EXPIRATION}

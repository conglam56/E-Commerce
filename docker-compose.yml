version: '3.8'
services:
  postgres:
    image: postgres:16-alpine
    container_name: ecommerce-postgres
    ports:
      - "5434:5432"
    environment:
      POSTGRES_DB: e-commerce
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: 123456
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data:

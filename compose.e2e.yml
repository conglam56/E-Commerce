services:
  mailbox:
    image: node:22-alpine
    command: ["node", "/tools/test-mailbox.mjs"]
    volumes:
      - ./tools/test-mailbox.mjs:/tools/test-mailbox.mjs:ro
    ports:
      - "127.0.0.1::8025"
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ecommerce_e2e
      POSTGRES_USER: e2e
      POSTGRES_PASSWORD: ${E2E_DB_PASSWORD:?Run npm run test:e2e from frontend}
    ports:
      - "127.0.0.1::5432"
    tmpfs:
      - /var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U e2e -d ecommerce_e2e"]
      interval: 2s
      timeout: 3s
      retries: 30

  app:
    build:
      context: .
      dockerfile: Dockerfile.render
    entrypoint: ["java", "-jar", "/app/app.jar", "--spring.config.import="]
    environment:
      DB_URL: jdbc:postgresql://postgres:5432/ecommerce_e2e
      DB_USERNAME: e2e
      DB_PASSWORD: ${E2E_DB_PASSWORD:?Run npm run test:e2e from frontend}
      JWT_SECRET: ${E2E_JWT_SECRET:?Run npm run test:e2e from frontend}
      JWT_EXPIRATION: "3600000"
      VNPAY_TMN_CODE: E2ETEST1
      VNPAY_HASH_SECRET: ${E2E_VNPAY_SECRET:?Run the E2E runner}
      SERVER_PORT: "8080"
      ACCOUNT_PUBLIC_URL: http://127.0.0.1:${E2E_APP_PORT:?Run the E2E runner}
      ACCOUNT_MAIL_ENDPOINT: http://mailbox:8025/emails
      ACCOUNT_MAIL_FROM: shop@example.invalid
      RESEND_API_KEY: local-mailbox-only
    ports:
      - "127.0.0.1:${E2E_APP_PORT}:8080"
    depends_on:
      postgres:
        condition: service_healthy
